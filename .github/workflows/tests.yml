name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Laravel 12 / PHP 8.2
            php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - name: Laravel 12 / PHP 8.4
            php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - name: Laravel 13 / PHP 8.3
            php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - name: Laravel 13 / PHP 8.4
            php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - name: Laravel 13 / PHP 8.5
            php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - name: Laravel 12 / PHP 8.2 / lowest dependencies
            php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
            dependency: lowest
          - name: Laravel 13 / PHP 8.3 / lowest dependencies
            php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
            dependency: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Illuminate version
        run: >
          composer require --no-update --no-interaction
          "illuminate/contracts:${{ matrix.laravel }}"
          "illuminate/http:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"

      - name: Select test dependencies
        run: >
          composer require --dev --no-update --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: >
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
          ${{ matrix.dependency == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Validate Composer package
        run: composer validate --strict

      - name: Run tests
        run: composer test -- --fail-on-warning --fail-on-risky

      - name: Audit production dependencies
        run: composer audit --locked --no-dev

      - name: Audit all dependencies including development
        run: composer audit --locked
