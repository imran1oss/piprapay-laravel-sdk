name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Laravel 11 / PHP 8.2
            php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - name: Laravel 12 / PHP 8.3
            php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - name: Laravel 13 / PHP 8.3
            php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - name: Laravel 13 / PHP 8.4
            php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - name: Laravel 13 / PHP 8.5
            php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Illuminate version
        run: >
          composer require --no-update --no-interaction
          "illuminate/contracts:${{ matrix.laravel }}"
          "illuminate/http:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"

      - name: Select test dependencies
        run: >
          composer require --dev --no-update --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Validate Composer package
        run: composer validate --strict

      - name: Run tests
        run: composer test
